name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "39 5 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan / gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
