name: Deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy / Cloudflare Pages
    # Secrets are not available to pull requests opened from forks, so the job would fail
    # rather than skip. Fork PRs still get the full CI workflow; they just get no preview.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      # Job-level env can read secrets; a job-level `if` cannot. This lets the deploy step skip
      # cleanly before the credentials exist, instead of failing every run until they do.
      HAS_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        env:
          # This project serves the app at the root of bureaucracy-as-code.pages.dev. The default
          # base, /bureaucracy-as-code/, is for the future apps/digital mount and would 404 every
          # asset here.
          VITE_APP_BASE: "/"
        run: pnpm build

      - name: Deploy
        if: env.HAS_CREDENTIALS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name and output directory come from wrangler.toml. A pull request deploys
          # to a preview URL named after its branch; main deploys to production.
          command: pages deploy --branch=${{ github.event_name == 'push' && 'main' || github.head_ref }}

      - name: Say why nothing was deployed
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::notice::Built, but did not deploy: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this repository. See docs/cloudflare-pages.md."
